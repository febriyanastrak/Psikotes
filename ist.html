<!DOCTYPE html>
<html lang="id" class="bg-white min-h-screen text-slate-800">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Modul Tes IST - PT Altrak 1978</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>

<body class="bg-[#f8fafc] text-slate-800 flex flex-col min-h-screen">

    <!-- Navbar Asesmen PT Altrak 1978 -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3 select-none">
                <img src="./logo%20altrak.jpeg" alt="PT Altrak 1978" draggable="false" style="pointer-events: none;"
                    class="h-10 md:h-11 w-auto object-contain rounded-lg shadow-2xs border border-slate-200 bg-white"
                    onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
                <div style="display:none" class="items-center gap-2">
                    <div class="w-9 h-9 rounded-xl bg-[#003865] flex items-center justify-center text-white shadow-xs">
                        <i class="fa-solid fa-briefcase text-base"></i>
                    </div>
                    <span class="text-[#003865] font-black text-lg tracking-wider">PT ALTRAK 1978</span>
                </div>
                <div class="hidden sm:block border-l border-slate-200 pl-3 ml-1">
                    <span class="text-xs font-black text-[#003865] uppercase tracking-wider block">Intelligence Structure Test</span>
                    <span class="text-[10px] text-slate-500 font-semibold block">Sistem Asesmen Online</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <a href="index.html" class="text-xs font-bold text-slate-500 hover:text-[#003865] px-3 py-1.5 rounded-xl border border-slate-200 hover:border-slate-300 bg-white transition flex items-center gap-1.5">
                    <i class="fa-solid fa-house text-slate-400"></i>
                    <span class="hidden sm:inline">Beranda</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Konten Utama Modul IST -->
    <main class="flex-grow flex flex-col items-center justify-start p-4 sm:p-6 md:p-8 relative w-full">
        <!-- Container Pemasangan Tampilan Dinamis -->
        <div id="ist-app-container" class="w-full max-w-6xl mx-auto">
            <!-- Loading Awal -->
            <div class="bg-white rounded-3xl p-12 text-center shadow-sm border border-slate-200 animate-pulse">
                <div class="w-10 h-10 rounded-full border-4 border-[#003865] border-t-transparent animate-spin mx-auto mb-3"></div>
                <p class="text-xs font-bold text-slate-500">Memuat Modul Soal IST...</p>
            </div>
        </div>
    </main>

    <!-- Custom Modal HTML / CSS (JANGAN gunakan window.alert bawaan) -->
    <div id="ist-custom-modal" class="hidden"></div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 px-4 text-center text-xs text-slate-500">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-2">
            <span>&copy; PT Altrak 1978 &bull; Human Resources Department. All rights reserved.</span>
            <span class="text-slate-400">Intelligence Structure Test (IST) Protocol</span>
        </div>
    </footer>

    <!-- Urutan Pemanggilan Skrip: Data -> UI -> Logika -->
    <script src="js/ist/ist-data.js"></script>
    <script src="js/ist/ist-ui.js"></script>
    <script src="js/ist/ist-logic.js"></script>
    <script>
        // Jalankan inisialisasi modul IST setelah DOM siap
        window.addEventListener('DOMContentLoaded', () => {
            istLogic.init();
        });
    </script>
</body>

</html>
